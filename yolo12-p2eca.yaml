#
# YOLOv12n modified for drone detection:
#   - ECA channel attention added after the P4 and P3 top-down fusion blocks
#     (helps suppress cluttered sky background: clouds, glare, birds, power lines)
#   - New P2/4 detection head added (helps catch tiny/far-away drones that
#     P3/P4/P5 alone would miss)
#
# Detect now reads 4 scales instead of 3: P2, P3, P4, P5
#
# Model docs (base architecture): https://docs.ultralytics.com/models/yolo12

# Parameters
nc: 1 # number of classes -- set to 1 for "drone" only; update if you add bird/plane classes
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12n backbone (unchanged from stock)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2  <- backbone P2 feature (used for new P2 head)
  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4  <- backbone P3 feature
  - [-1, 1, Conv, [512, 3, 2]]             # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]         # 6  <- backbone P4 feature
  - [-1, 1, Conv, [1024, 3, 2]]            # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]        # 8  <- backbone P5 feature

# YOLO12n head -- modified: +ECA after P4/P3 fuse, +P2 branch, 4-scale Detect
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9  P5 -> P4 res
  - [[-1, 6], 1, Concat, [1]]                     # 10 cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]]              # 11 P4 fused (top-down)
  - [-1, 1, ECA, [512]]                           # 12 ECA attention on P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13 P4 -> P3 res
  - [[-1, 4], 1, Concat, [1]]                     # 14 cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]]              # 15 P3 fused (top-down)
  - [-1, 1, ECA, [256]]                           # 16 ECA attention on P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17 P3 -> P2 res  (NEW)
  - [[-1, 2], 1, Concat, [1]]                     # 18 cat backbone P2  (NEW)
  - [-1, 2, C3k2, [128, False, 0.25]]             # 19 *** P2 OUTPUT *** (NEW)

  - [-1, 1, Conv, [128, 3, 2]]                    # 20 downsample P2 -> P3 res
  - [[-1, 16], 1, Concat, [1]]                     # 21 cat P3 fused (post-ECA)
  - [-1, 2, A2C2f, [256, False, -1]]              # 22 *** P3 OUTPUT ***

  - [-1, 1, Conv, [256, 3, 2]]                    # 23 downsample P3 -> P4 res
  - [[-1, 12], 1, Concat, [1]]                     # 24 cat P4 fused (post-ECA)
  - [-1, 2, A2C2f, [512, False, -1]]              # 25 *** P4 OUTPUT ***

  - [-1, 1, Conv, [512, 3, 2]]                    # 26 downsample P4 -> P5 res
  - [[-1, 8], 1, Concat, [1]]                      # 27 cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                   # 28 *** P5 OUTPUT ***

  - [[19, 22, 25, 28], 1, Detect, [nc]]           # 29 Detect(P2, P3, P4, P5)
